openapi: 3.0.3
info:
  title: Products API (Construct demo fixture)
  version: 1.0.0
  description: >
    A small, deliberately minimal 2-operation OpenAPI spec used by the
    Demos module (#125, #133) to show `construct create service` compiling
    a real products data layer straight from a spec, with zero LLM calls
    — the contrast case against #133's LLM-assisted page-logic subtask.
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all products
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /products/{productId}:
    get:
      operationId: getProductById
      summary: Get a single product by id
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number
        description:
          type: string
