name: Pages documentation

# Builds the documentation site (User Guide + Developer Docs, site/build.mjs) and publishes it.
#
# This repo is private, so GitHub Pages here needs a paid plan and may already be disabled
# (confirmed 404 on GET /repos/thenewurbankid-web/construct/pages, 2026-09-22). The docs site is
# instead published to a NEW `gh-pages` branch of a separate, already-public repo the owner owns —
# thenewurbankid-web/cockpit (an unrelated old prototype; only that one new branch is touched,
# never its existing code or branches) — with GitHub Pages enabled there.
# Live at https://thenewurbankid-web.github.io/cockpit/
#
# If this repo's own Pages ever comes back (repo goes public again, or a paid plan is added), swap
# the `publish` job below for actions/upload-pages-artifact + actions/deploy-pages against the
# `build` job's `site/dist` output (see this file's git history before the cross-repo-publish change
# for that job definition) — or run both in parallel.
#
# Cross-repo push needs a token with write access to thenewurbankid-web/cockpit; the default
# GITHUB_TOKEN only covers this repo. To enable `publish`:
#   1. Create a fine-grained personal access token scoped ONLY to thenewurbankid-web/cockpit, with
#      repository permission "Contents: Read and write".
#   2. Add it to THIS repo as a secret named COCKPIT_REPO_TOKEN
#      (Settings > Secrets and variables > Actions > New repository secret).
# Until that secret exists, `publish` is skipped (its steps check for it) and only `build` runs, so
# regressions in the site generator are still caught by every push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*'] # a release publishes its /X.Y/ docs (path filters do not apply to tags)
    paths: ['site/**', 'docs/**', 'README.md', 'packages/**', 'schemas/**', 'package.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */6 * * *'
  issues:
    types: [edited, closed, reopened, labeled]

permissions:
  contents: read
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # For issue events, only rebuild when the issue is a demo ticket. The title is
    # compared in an expression and never interpolated into a shell command.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every v*.*.* tag is built into its own /X.Y/ path
      - run: git fetch --tags --force
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci
      - name: Test site generator
        run: node --test site/test/*.test.mjs
      # One artifact holds every version (each publish replaces the whole site):
      # / = newest release (main while no tag exists), /X.Y/ = each release, /next/ = this checkout.
      # --repo is the COCKPIT repo (not this one): base paths, canonical URLs, sitemap and the 404
      # page all need to match where the site is actually served.
      - name: Build all documentation versions
        run: node site/build-all.mjs --repo thenewurbankid-web/cockpit --out site/dist
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/dist
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check for COCKPIT_REPO_TOKEN
        id: check
        run: echo "has-token=${{ secrets.COCKPIT_REPO_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.has-token == 'true'
        with:
          name: docs-site
          path: site/dist
      - name: Push to thenewurbankid-web/cockpit#gh-pages
        if: steps.check.outputs.has-token == 'true'
        env:
          COCKPIT_REPO_TOKEN: ${{ secrets.COCKPIT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/cockpit-gh-pages
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${COCKPIT_REPO_TOKEN}@github.com/thenewurbankid-web/cockpit.git" \
            /tmp/cockpit-gh-pages
          cd /tmp/cockpit-gh-pages
          # Replace tracked content with the new build; .git (and any other branch) is untouched.
          git rm -rf . >/dev/null
          cp -a "$GITHUB_WORKSPACE/site/dist/." .
          git config user.name "construct-docs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes; nothing to publish."
            exit 0
          fi
          git commit -m "docs: publish from thenewurbankid-web/construct@${GITHUB_SHA}"
          git push origin gh-pages
      - name: COCKPIT_REPO_TOKEN not set
        if: steps.check.outputs.has-token != 'true'
        run: |
          echo "::warning::COCKPIT_REPO_TOKEN secret is not set on this repo — skipping publish to thenewurbankid-web/cockpit#gh-pages. See the comment block at the top of .github/workflows/pages.yml for what to add."
