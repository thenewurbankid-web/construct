name: Pages documentation

# Builds the documentation site (User Guide + Developer Docs, site/build.mjs) and publishes it to
# THIS repo's GitHub Pages: https://thenewurbankid-web.github.io/construct/
#
# History: while this repo was private (2026-09-22 to 2026-09-23) GitHub Pages was unavailable on
# the owner's plan, so the site was pushed cross-repo to thenewurbankid-web/cockpit#gh-pages with a
# COCKPIT_REPO_TOKEN secret that was never added -- the site was 404 the whole time. The repo went
# public on 2026-09-23 (#540 / #559) and native Pages replaced that hack; no secret is needed now.
# The old cockpit#gh-pages branch is a stale copy and can be deleted once this publishes.
#
# Branch: `main` is frozen at tag stable-2026-09-23 and ongoing work merges to work/2026-09-23,
# so the site is built from work/2026-09-23 (the / and /next/ paths) plus every v*.*.* tag.
# When main is unfrozen, put it back in `branches:` below.

on:
  workflow_dispatch:
  push:
    branches: [work/2026-09-23, main]
    tags: ['v*.*.*'] # a release publishes its /X.Y/ docs (path filters do not apply to tags)
    paths: ['site/**', 'docs/**', 'README.md', 'packages/**', 'schemas/**', 'package.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */6 * * *'
  issues:
    types: [edited, closed, reopened, labeled]

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # For issue events, only rebuild when the issue is a demo ticket. The title is
    # compared in an expression and never interpolated into a shell command.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every v*.*.* tag is built into its own /X.Y/ path
      - run: git fetch --tags --force
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm ci
      - name: Test site generator
        run: node --test site/test/*.test.mjs
      # One artifact holds every version (each publish replaces the whole site):
      # / = newest release (the checkout while no tag exists), /X.Y/ = each release, /next/ = this checkout.
      # --repo is where the site is served: base paths, canonical URLs, sitemap and the 404 page match it.
      - name: Build all documentation versions
        run: node site/build-all.mjs --repo thenewurbankid-web/construct --out site/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
