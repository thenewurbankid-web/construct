name: Pages documentation

# Builds the documentation site (User Guide + Developer Docs, site/build.mjs) and deploys it to GitHub Pages.
# Reused docs (README.md, docs/, packages/ast/README.md) are rendered at build time; tutorials come from the published guide tickets.
# Live at https://thenewurbankid-web.github.io/construct/

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*'] # a release publishes its /X.Y/ docs (path filters do not apply to tags)
    paths: ['site/**', 'docs/**', 'README.md', 'packages/**', 'schemas/**', 'package.json', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 */6 * * *'
  issues:
    types: [edited, closed, reopened, labeled]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # For issue events, only rebuild when the issue is a demo ticket. The title is
    # compared in an expression and never interpolated into a shell command.
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[Demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every v*.*.* tag is built into its own /X.Y/ path
      - run: git fetch --tags --force
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/configure-pages@v6
      - name: Install build dependencies
        run: npm ci
      - name: Test site generator
        run: node --test site/test/*.test.mjs
      # One artifact holds every version (Pages replaces the whole site on each deploy):
      # / = newest release (main while no tag exists), /X.Y/ = each release, /next/ = this checkout.
      - name: Build all documentation versions
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node site/build-all.mjs --out site/dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
