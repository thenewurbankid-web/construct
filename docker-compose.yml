# #485 -- self-hosted Cockpit. Two services, mirroring the two-process
# topology tools/dev/run-hosted.sh already runs by hand (client on 3000,
# server on 4000). See docs/DEPLOY.md for real, verified copy-paste
# instructions -- this file only wires the pieces together.
#
# Env vars (see docs/DEPLOY.md for the full table):
#   CONSTRUCT_SESSION_SECRET (required)     CONSTRUCT_GITHUB_CLIENT_ID
#   CONSTRUCT_ALLOWED_LOGINS                CONSTRUCT_GITHUB_CLIENT_SECRET
#   PUBLIC_HOST (default localhost)         SCHEME (default http)
#   WS_SCHEME (default ws; set wss when SCHEME=https)
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      CONSTRUCT_GITHUB_CLIENT_ID: "${CONSTRUCT_GITHUB_CLIENT_ID:-}"
      CONSTRUCT_GITHUB_CLIENT_SECRET: "${CONSTRUCT_GITHUB_CLIENT_SECRET:-}"
      CONSTRUCT_ALLOWED_LOGINS: "${CONSTRUCT_ALLOWED_LOGINS:-}"
      CONSTRUCT_SESSION_SECRET: "${CONSTRUCT_SESSION_SECRET:?set CONSTRUCT_SESSION_SECRET -- e.g. openssl rand -hex 32}"
      CONSTRUCT_WORKSPACE_ROOT: /workspace
      UI_CLIENT_ORIGIN: "${SCHEME:-http}://${PUBLIC_HOST:-localhost}:3000"
    volumes:
      - cockpit-workspace:/workspace
      - cockpit-state:/home/node/.local/state
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_API_BASE: "${SCHEME:-http}://${PUBLIC_HOST:-localhost}:4000"
        NEXT_PUBLIC_WS_BASE: "${WS_SCHEME:-ws}://${PUBLIC_HOST:-localhost}:4000"
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  cockpit-workspace:
  cockpit-state:
