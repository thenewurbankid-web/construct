<svg xmlns="http://www.w3.org/2000/svg" viewBox="13 24 34 17"><!-- Trace mark: the outlined blue pill of the Line logo, verbatim from docs/brand/line.svg on origin/main of the construct repo (MIT): the second <rect> (x16 y27 28x11 rx5.5, stroke 2.8, gradient #8fb0ff to #4b63f5), viewBox cropped to the pill. Stroke only, never filled. Light-theme stops are deeper so it holds 3:1 on paper. -->
<style>.a{stop-color:#5a72f2}.b{stop-color:#3448d6}@media (prefers-color-scheme:dark){.a{stop-color:#8fb0ff}.b{stop-color:#4b63f5}}</style><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44"><stop class="a" offset="0"/><stop class="b" offset="1"/></linearGradient></defs><rect x="16" y="27" width="28" height="11" rx="5.5" fill="none" stroke="url(#g)" stroke-width="2.8"/></svg>
