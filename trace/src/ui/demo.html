<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{NAME}}</title>
<script>/* theme before first paint: trace-theme = light | dark; anything else (or blocked storage) follows the system */
(function(){try{var t=localStorage.getItem("trace-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()
</script>
<link rel="icon" type="image/svg+xml" href="/demo/assets/trace-favicon.svg">
<link rel="stylesheet" href="/demo/demo-tokens.css">
<link rel="stylesheet" href="/demo/demo.css">
<link rel="stylesheet" href="/demo/hero3d/hero.css">
<link rel="stylesheet" href="/inspector/inspector.css">
</head>
<body>
<a class="skiplink" href="#main">Skip to the content</a>

<header class="top" id="top">
  <a class="brand" href="/" aria-label="{{NAME}}, back to the start" id="brand"><svg class="mark" width="34" height="17" viewBox="13 24 34 17" aria-hidden="true" focusable="false"><defs><linearGradient id="trace-g" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44"><stop offset="0" style="stop-color:var(--mark-a,#8fb0ff)"/><stop offset="1" style="stop-color:var(--mark-b,#4b63f5)"/></linearGradient></defs><rect x="16" y="27" width="28" height="11" rx="5.5" fill="none" stroke="url(#trace-g)" stroke-width="2.8"/></svg><span class="brand-name">{{NAME}}</span></a>
  <ol class="steps" aria-label="Where you are" id="steps">
    <li data-step="drop"><span class="n">1</span>Drop in</li>
    <li data-step="fit"><span class="n">2</span>The fit</li>
    <li data-step="hand"><span class="n">3</span>The Handoffs</li>
  </ol>
  <div class="top-actions">
    <button class="btn ghost sm" id="bPresent" type="button" aria-pressed="false" title="Bigger type, slower reveal, no extras"></button>
    <button class="btn ghost sm icon-only" id="bTheme" type="button" aria-label="Switch between light and dark" title="Switch between light and dark"></button>
    <a class="btn ghost sm" id="bDetails" href="/studio" title="Open the full studio with every detail"></a>
    <span class="reset" id="resetBox"></span>
  </div>
</header>

<main id="main" tabindex="-1">
  <div class="notice" id="notice" role="status" hidden></div>

  <section class="screen" id="s-drop" aria-labelledby="dropTitle">
    <div class="drop-hero">
      <p class="eyebrow">{{NAME}}</p>
      <h1 id="dropTitle">{{TAGLINE}}</h1>
    </div>
    <div class="drop-grid">
      <div class="drop-col">
        <h2 class="label" id="scenLabel">Pick a screen to wire</h2>
        <div class="scen" id="scen" role="radiogroup" aria-labelledby="scenLabel"></div>
      </div>
      <div class="drop-col drop-design" id="designCol">
        <h2 class="label" id="designLabel">Design</h2>
        <figure class="thumb" id="thumb" aria-labelledby="designLabel">
          <div class="thumb-frame" id="thumbFrame" aria-hidden="true"></div>
          <figcaption id="thumbCap"></figcaption>
        </figure>
      </div>
      <div class="drop-col">
        <h2 class="label" id="contractLabel">Contract</h2>
        <div class="contract" id="contract" aria-labelledby="contractLabel"></div>
        <div class="hero3d" id="hero3d" data-hero="pending" aria-hidden="true"><svg class="hero3d-svg" viewBox="13 24 34 17" focusable="false"><defs><linearGradient id="hero3d-g" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="44" y2="44"><stop offset="0" style="stop-color:var(--mark-a,#8fb0ff)"/><stop offset="1" style="stop-color:var(--mark-b,#4b63f5)"/></linearGradient></defs><rect x="16" y="27" width="28" height="11" rx="5.5" fill="none" stroke="url(#hero3d-g)" stroke-width="2.8"/></svg></div>
      </div>
    </div>
    <div class="drop-foot">
      <label class="switch" id="suggestBox">
        <input type="checkbox" id="suggestOn">
        <span class="track" aria-hidden="true"></span>
        <span class="switch-text"><b>Let Suggest answer what it can</b><small id="suggestNote"></small></span>
      </label>
      <div class="wire-block">
        <button class="btn primary lg" id="bWire" type="button"></button>
        <ol class="how" id="how" aria-label="What happens next"></ol>
      </div>
    </div>
  </section>

  <section class="screen" id="s-fit" aria-labelledby="fitTitle" hidden>
    <h1 class="sr-only" id="fitTitle">The fit</h1>
    <div class="fit-grid">
      <div class="stage" id="stage">
        <div class="stage-head">
          <span class="stage-title" id="stageTitle"></span><span class="legend" id="legend"></span>
          <span class="view-tools" id="viewTools">
            <span class="seg" role="group" aria-label="How to look at the trace"><button type="button" id="vPage" aria-pressed="true">Page</button><button type="button" id="vMap" aria-pressed="false">Map</button></span>
            <button class="btn sm" type="button" id="bTrace" disabled></button>
          </span>
        </div>
        <div class="stage-mid" id="stageMid" data-view="page">
          <div class="stage-body" id="stageBody"><div class="pv" id="pv"></div></div>
          <aside class="rail" id="rail" aria-label="Contract">
            <div class="rail-head" id="railHead"><b>Contract</b><span id="railSub"></span></div>
            <ul class="rail-eps" id="railEps"></ul>
            <div class="rail-stub" id="railStub" hidden><i class="sw stub" aria-hidden="true"></i><span>Stubs <b id="stubN">0</b></span><small>marked stand-ins</small></div>
          </aside>
          <canvas id="traceCanvas" class="trace-canvas" aria-hidden="true"></canvas>
          <section class="map" id="map" aria-label="Trace map" hidden>
            <div class="map-main">
              <canvas id="mapCanvas" aria-hidden="true"></canvas>
              <div class="map-tools"><button class="btn sm icon-only" type="button" id="mapOut" aria-label="Zoom out" title="Zoom out">&minus;</button><button class="btn sm icon-only" type="button" id="mapIn" aria-label="Zoom in" title="Zoom in">+</button><button class="btn sm" type="button" id="mapFit" title="Show everything">Fit to view</button></div>
              <p class="map-hint" aria-hidden="true">Drag to move, scroll to zoom. Click a part to select it.</p>
            </div>
            <div class="map-side" id="mapSide"><div class="map-pick" id="mapPick" role="status" aria-live="polite"></div></div>
          </section>
        </div>
        <details class="tlist" id="traceDetails"><summary>The trace, as a list <small id="traceCount"></small></summary><div class="tl-holder"><ul class="tl" id="traceList"></ul></div></details>
        <div class="offpage" id="offpage" hidden></div>
      </div>
      <aside class="side" id="side" aria-label="Progress">
        <div class="hero" id="hero"></div>
        <div class="progress" id="progress" role="status" aria-live="polite"></div>
        <div class="side-body" id="sideBody"></div>
      </aside>
    </div>
  </section>

  <section class="screen" id="s-hand" aria-labelledby="handTitle" hidden>
    <div class="hand-head" id="handHead"></div>
    <div class="hand-grid" id="handGrid"></div>
    <details class="ledger" id="ledger"></details>
  </section>
</main>

<footer class="keys" id="keys" aria-label="Keyboard shortcuts"></footer>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="notice">{{NAME}} needs JavaScript to run.</p></noscript>
<script type="module" src="/demo/demo.mjs"></script>
<script type="module" src="/demo/hero3d/hero.mjs"></script>
</body>
</html>
