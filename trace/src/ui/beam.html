<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Planner eval — Trace</title>
<link rel="icon" type="image/svg+xml" href="/demo/assets/trace-favicon.svg">
<script>/* same theme rule as the rest of Trace: lm-theme = light | dark, anything else follows the system */
(function(){try{var t=localStorage.getItem("lm-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()
</script>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,sans-serif}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--stat);border-radius:4px;padding:0 4px}
a{color:var(--acc)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
header.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:12px}
header.top h1{font-size:20px;margin:0 auto 0 0}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.sub{color:var(--mut);font-size:12.5px}
.empty{color:var(--mut)}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:0 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--grn)}.chip.warn{color:var(--red)}.chip.mut{color:var(--mut)}
button,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd2);border-radius:6px}
button{cursor:pointer;padding:4px 10px}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
select{padding:3px 6px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.setupbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.setupbar label{display:flex;gap:6px;align-items:center;font-size:13px}
.setupbar .sep{flex:0 0 1px;align-self:stretch;background:var(--bd)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.stat b{font-size:22px;line-height:1.2}
.stat .k,.rline .k,.sc .k{font-size:12px;color:var(--mut)}
.stat.warn b{color:var(--red)}
table{border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:3px 10px;text-align:left}
table.compare{margin:6px 0 12px;background:var(--card);border-radius:8px}
table.compare caption{text-align:left;font-size:12px;color:var(--mut);padding:4px 0}
tr.ok td{color:var(--grn)}tr.near td{color:var(--amb)}tr.warn td,tr.warn th{color:var(--red);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:14px;align-items:start}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
button.item{width:100%;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-color:var(--bd)}
button.item.sel{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.row1{display:flex;justify-content:space-between;gap:6px;align-items:center}
.req{margin:0}
.detail{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;min-width:0}
.run{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.run.rec{border-color:var(--grn)}
.run header{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
ol.path{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:3px}
.node{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-left:14px;position:relative}
.node::before{content:"→";position:absolute;left:0;color:var(--line)}
.node:first-child::before{content:"•"}
.layer{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);min-width:78px}
.dec{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid currentColor}
.d-stub{color:var(--ph);background:var(--phbg)}.d-fn{color:var(--grn)}.d-create{color:var(--red);background:var(--redbg)}
.d-src,.d-dyn{color:var(--acc)}.d-fork{color:var(--amb);background:var(--ambbg);font-weight:700}.d-other{color:var(--mut)}
.picks{font-size:11.5px;color:var(--mut)}
p.scores{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0}
.just{margin:0 0 4px;font-style:italic}
form.owner{display:flex;flex-direction:column;gap:6px}
.rline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;align-items:center}
.btns{display:flex;gap:4px}
.sbtn{min-width:34px}
.sbtn[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.note{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.note textarea{width:100%;padding:6px}
@media(max-width:860px){.cols{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.wrap{padding:16px 16px 40px}.layer{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Planner eval</h1>
    <span class="sub">Opus-Requester writes · planner answers · Opus-Grader scores blind · you score</span>
    <a href="/quality">Quality</a>
    <a href="/about">About</a>
    <a class="back" href="/studio">Back to the studio</a>
  </header>
  <main id="app"><p class="empty">Loading…</p></main>
</div>
<script type="module">
import { mountBeam } from "/ui/beam.mjs";
mountBeam(document.getElementById("app"));
</script>
</body>
</html>
